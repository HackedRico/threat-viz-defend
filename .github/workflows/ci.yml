name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Test the hook integration
        if: hashFiles('integrations/hook/tests/**') != ''
        run: uv run pytest ../integrations/hook/tests

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check openapi.json is current
        working-directory: api
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -m app.openapi > /tmp/o.json
          if ! diff -q /tmp/o.json ../web/openapi.json; then
            diff -u ../web/openapi.json /tmp/o.json | head -100
            echo "::error file=web/openapi.json::web/openapi.json is out of date. Run 'npm run gen:api' in web/ and commit the result."
            exit 1
          fi
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: threatviz-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build the combined image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: full
          push: false
          tags: threatviz-full:ci
          cache-from: type=gha,scope=full
          cache-to: type=gha,mode=max,scope=full
