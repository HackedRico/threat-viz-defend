[project]
name = "threatviz-api"
version = "0.1.0"
description = "API for ThreatViz Defend: threat models drawn from code and docs, and a quiz that checks you can defend them."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "cryptography>=46",
    "fastapi>=0.141",
    "httpx>=0.28",
    "mcp>=2.2",
    "openai>=3.19",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PT"]
# Tests use plain `assert`.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Fixtures hold fake credentials on purpose, to prove they get masked.
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
