# Production-like local run: Postgres 16 and one container that serves the API
# and the built web app on the same origin, at http://localhost:8080.
#
#   cp .env.example .env    # then edit it
#   docker compose up --build
#
# Compose reads .env twice: for the ${...} values below, and as the app's
# environment. DATABASE_URL and STATIC_DIR here win over .env.

name: threatviz

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatviz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatviz-local}
      POSTGRES_DB: ${POSTGRES_DB:-threatviz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: full
    image: threatviz-full:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatviz}:${POSTGRES_PASSWORD:-threatviz-local}@db:5432/${POSTGRES_DB:-threatviz}
      STATIC_DIR: /app/web/dist
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
